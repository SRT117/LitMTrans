name: Build Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit -r requirements.txt

  release:
    needs: audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/validate_release.py --tag "${{ github.ref_name }}"
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_release.py
      - run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: |
          $version = (python -c "from app_version import APP_VERSION; print(APP_VERSION)").Trim()
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" 'installer\LitMTrans.iss'
      - name: Create update manifest and checksums
        shell: powershell
        run: |
          $version = (python -c "from app_version import APP_VERSION; print(APP_VERSION)").Trim()
          $installer = "installer_dist\LitMTrans-$version-setup.exe"
          python scripts/create_update_manifest.py --installer $installer --tag "${{ github.ref_name }}" --output installer_dist\update.json --notes "查看本版本的 GitHub Release 说明。"
          (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $installer -Leaf) | Set-Content installer_dist\SHA256SUMS.txt -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            installer_dist/LitMTrans-*-setup.exe
            installer_dist/update.json
            installer_dist/SHA256SUMS.txt
