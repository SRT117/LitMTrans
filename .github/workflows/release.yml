name: Build Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit -r requirements.txt

  release:
    needs: audit
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: choco install innosetup pandoc --no-progress -y
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/validate_release.py --tag "${{ github.ref_name }}"
      - run: python scripts/fetch_release_runtime.py
      - run: python -m unittest discover -s tests -v
      - name: Build Windows release
        shell: pwsh
        run: |
          python scripts/build_release.py
          $version = (python -c "from app_version import APP_VERSION; print(APP_VERSION)").Trim()
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" 'installer\LitMTrans.iss'

      - name: Create update manifest and checksums
        shell: pwsh
        run: |
          $version = (python -c "from app_version import APP_VERSION; print(APP_VERSION)").Trim()
          $installer = "installer_dist\LitMTrans-$version-setup.exe"
          python scripts/create_update_manifest.py --installer $installer --tag "${{ github.ref_name }}" --output update.json --notes "See GitHub Release notes."
          $sum = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $installer -Leaf)
          $sum | Set-Content installer_dist\SHA256SUMS.txt -Encoding ascii
      - name: Sync update manifest to main branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          $version = (python -c "from app_version import APP_VERSION; print(APP_VERSION)").Trim()
          $installer = "installer_dist\LitMTrans-$version-setup.exe"
          python scripts/create_update_manifest.py --installer $installer --tag "${{ github.ref_name }}" --output update.json --notes "See GitHub Release notes."
          git add update.json
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(release): update manifest for ${{ github.ref_name }} [skip ci]"
            git push origin main
          }
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            installer_dist/LitMTrans-*-setup.exe
            installer_dist/SHA256SUMS.txt
            update.json
